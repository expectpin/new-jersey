# frontend/nginx.conf
server {
  listen 80;

  # Bloco para encaminhar pedidos de API para o serviço de backend
  location /api {
    # Remove o prefixo /api do URL antes de o enviar para o backend
    # Ex: /api/devices torna-se /devices
    rewrite /api/(.*) /$1 break;

    # Encaminha o pedido para o serviço 'backend' definido no docker-compose.yml
    proxy_pass http://backend:3000;

    # Cabeçalhos recomendados para o proxy
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Bloco para servir os ficheiros estáticos da aplicação Angular
  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri $uri/ /index.html;
  }
}
