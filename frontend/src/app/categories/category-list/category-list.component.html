<div>
  <h1>Lista de Categorias</h1>
  <a routerLink="/categories/new">Nova Categoria</a>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let category of categories">
        <td>{{ category.id }}</td>
        <td>{{ category.name }}</td>
        <td>
          <a [routerLink]="['/categories/edit', category.id]">Editar</a>
          <button (click)="delete(category.id)">Excluir</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
