<!-- src/app/features/categories/category-form/category-form.component.html -->
<div>
  <h2>{{ isEditMode ? 'Editar' : 'Nova' }} Categoria</h2>
  <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()">
    <div>
      <label for="name">Nome:</label>
      <input id="name" formControlName="name">
    </div>
    <button type="submit" [disabled]="categoryForm.invalid">Salvar</button>
    <a routerLink="/categories">Cancelar</a>
  </form>
</div>
